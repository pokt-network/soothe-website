name: Docker image

# The landing site lives on the new-soothe-landing branch (main holds the older
# @soothe/web app), so that branch is the one that publishes.
on:
  push:
    branches: [new-soothe-landing]
  pull_request:
  workflow_dispatch:

env:
  HARBOR_IMAGE: registry.infra.pocket.network/pnf/soothe-landing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pull requests (including from forks) only build; pushes to the branch and manual runs also publish.
      PUSH: ${{ github.event_name != 'pull_request' }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.infra.pocket.network
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HARBOR_IMAGE }}
          tags: |
            # sha-<short sha>, same scheme as pokt-money; pnf-ops pins this tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/new-soothe-landing' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
